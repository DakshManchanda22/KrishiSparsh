# Render Blueprint: Plant Disease Prediction API
# Deploy: connect this repo, set Root Directory to "Plant-Disease-Prediction-using-Python-CNN"
# Ensure FinalModel.pth is in this directory (extract from FinalModel.zip/rar)

services:
  - type: web
    name: plant-disease-api
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
